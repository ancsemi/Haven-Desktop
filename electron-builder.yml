appId: com.haven.desktop
productName: Haven
copyright: Copyright © 2024-2026 Haven

publish:
  - provider: github
    owner: ancsemi
    repo: Haven-Desktop
    releaseType: release

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "assets/**/*"
  - "native/build/Release/*.node"
  - "node_modules/**/*"
  - "!node_modules/**/build/Release/obj*"
  - "package.json"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Haven

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Network;Chat;InstantMessaging
  desktop:
    Name: Haven
    Comment: Private self-hosted chat
    Terminal: false

deb:
  afterInstall: assets/linux/postinst.sh

# Static type-2 runtime (1.0.2). The default 0.0.0 runtime dlopens
# libfuse.so.2, which Fedora 40+/Ubuntu 24.04+ no longer ship, so the
# AppImage refused to start even when FUSE3 was installed. Other AppImages
# on the same machine already used this runtime, which is why they worked.
toolsets:
  appimage: "1.0.2"

extraResources:
  - from: native/build/Release/
    to: native/
    filter:
      - "*.node"
