<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading Haven…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #0d0d1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .hex {
      font-size: 88px;
      line-height: 1;
      color: #6b4fdb;
      filter: drop-shadow(0 0 32px rgba(107, 79, 219, .45));
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%      { transform: scale(1.06); opacity: .85; }
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: -6px;
    }
    h1 .brand { color: #6b4fdb; }
    .status {
      color: #888;
      font-size: 13px;
      letter-spacing: .3px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #2a2a50;
      border-top-color: #6b4fdb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-top: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      position: absolute;
      bottom: 14px;
      left: 0; right: 0;
      text-align: center;
      color: #555;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hex">⬢</div>
    <h1>Loading <span class="brand">Haven</span>…</h1>
    <div class="spinner" aria-label="Loading"></div>
    <div class="status">Connecting to your server</div>
  </div>
  <div class="footer">Haven Desktop</div>
</body>
</html>
