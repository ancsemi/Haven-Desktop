name: Validate Haven Desktop PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native audio addon
        run: npm run build:native

      - name: Smoke test Electron runtime
        run: npm run smoke:electron

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Smoke test packaged Windows addon
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          .\dist\win-unpacked\Haven.exe -e "const a=require('./dist/win-unpacked/resources/native/haven_audio.node'); if(typeof a.startCapture!=='function') process.exit(1)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: dist/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libx11-dev libxtst-dev libxinerama-dev libxt-dev libxrandr-dev libxfixes-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native audio addon
        run: npm run build:native

      - name: Smoke test Electron runtime
        run: xvfb-run -a npm run smoke:electron -- --no-sandbox

      - name: Build Linux packages
        run: npx electron-builder --linux --publish never

      - name: Smoke test packaged Linux addon
        run: ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/haven-desktop -e "const a=require('./dist/linux-unpacked/resources/native/haven_audio.node'); if(typeof a.startCapture!=='function') process.exit(1)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  build-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native audio addon
        run: npm run build:native

      - name: Smoke test Electron runtime
        run: npm run smoke:electron

      - name: Build macOS package
        run: npx electron-builder --mac --x64 --publish never

      - name: Smoke test packaged macOS addon
        run: |
          app_path="$(find dist -type d -name Haven.app -print -quit)"
          test -n "$app_path"
          addon_path="$PWD/$app_path/Contents/Resources/native/haven_audio.node"
          test -f "$addon_path"
          ELECTRON_RUN_AS_NODE=1 "$app_path/Contents/MacOS/Haven" -e "const a=require(process.argv[1]); if(a.isSupported()!==false||a.getAudioApplications().length!==0||a.startCapture(0,()=>{})!==false) process.exit(1); a.cleanup()" "$addon_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-macos
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
