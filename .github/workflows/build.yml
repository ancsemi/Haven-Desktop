name: Build Haven Desktop

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0
  workflow_dispatch:    # Manual trigger from GitHub UI

permissions:
  contents: write      # Needed to create releases

jobs:
  # ─── Windows Build ──────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build native audio addon
        run: npm run build:native

      # electron-builder 26 uploads the installer and its blockmap in parallel,
      # and when no release exists yet each upload creates one, so a tag ended
      # up with two releases (1.4.29). Creating the release first gives both
      # jobs one place to attach to. releaseType is "release" in
      # electron-builder.yml, which matches a published release, so the
      # publisher reuses it instead of refusing it.
      - name: Create the GitHub release before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --notes "Release notes to follow."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: |
            dist/*.exe
          retention-days: 30

  # ─── Linux Build ────────────────────────────────────────
  build-linux:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PulseAudio dev headers
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libx11-dev libxtst-dev libxinerama-dev libxt-dev libxrandr-dev libxfixes-dev

      - name: Install dependencies
        run: npm ci

      - name: Build native audio addon
        run: npm run build:native

      - name: Build & Publish Linux packages
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30
